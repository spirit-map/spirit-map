<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта партнеров</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            width: 100%; height: 100vh;
            position: absolute; top: 0; left: 0; z-index: 1;
            transition: margin-left 0.3s ease;
        }
        .sidebar {
            position: absolute; top: 0; left: 0;
            width: 320px; height: 100vh;
            background-color: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 1000; display: flex; flex-direction: column;
            transition: transform 0.3s ease;
        }
        .sidebar.hidden { transform: translateX(-100%); }
        .sidebar-header {
            padding: 20px 20px 10px 20px;
            border-bottom: 1px solid #eee;
        }
        .sidebar-header h2 { margin: 0 0 5px 0; font-size: 20px; color: #333; }
        .sidebar-header p { margin: 0 0 5px 0; font-size: 12px; color: #888; }
        
        .total-stats {
            font-size: 13px;
            font-weight: 600;
            color: #ff6600;
            margin-bottom: 10px;
        }

        .search-box {
            margin-bottom: 10px;
        }
        .search-box input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        .controls {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .btn-control {
            flex: 1;
            padding: 8px 5px;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid #ddd;
            background: #f9f9f9;
            border-radius: 4px;
            transition: background 0.2s;
            color: #333;
            white-space: nowrap;
        }
        .btn-control:hover { background: #eee; }
        .btn-reset-filter {
            background: #fff3e0;
            border-color: #ffcc80;
            color: #e65100;
            font-weight: 600;
        }
        .btn-reset-filter:hover { background: #ffe0b2; }

        .company-list {
            flex-grow: 1; overflow-y: auto; padding: 10px 0;
        }
        .company-item {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }
        .company-item:hover { background-color: #f9f9f9; }
        .company-item.active { border-left: 4px solid #ff6600; background-color: #fffaf5; }
        
        .company-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
        }
        
        .company-name { font-size: 14px; color: #333; font-weight: 500; }
        
        .company-count {
            background-color: #f0f0f0; color: #666;
            font-size: 12px; padding: 2px 8px; border-radius: 10px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            padding: 5px;
            font-size: 14px;
            transition: color 0.2s;
            display: none;
        }
        .company-item:hover .delete-btn {
            display: block;
        }
        .delete-btn:hover {
            color: #e74c3c;
        }

        .toggle-btn {
            position: absolute; right: -36px; top: 20px;
            width: 36px; height: 40px;
            background: #fff; border: none;
            border-radius: 0 8px 8px 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            cursor: pointer; z-index: 1001;
            display: flex; align-items: center; justify-content: center;
            color: #333; transition: background 0.2s;
        }
        .toggle-btn:hover { background: #f0f0f0; }
        .marker-custom {
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        .fitness-subitem {
            padding-left: 40px;
            font-size: 13px;
            background-color: #fafafa;
        }
        .fitness-subitem:hover { background-color: #f0f0f0; }
        .fitness-subitem.active { background-color: #e6f2ff; border-left: 4px solid #3498db; }
        .radius-circle {
            stroke: #3498db;
            fill: #3498db;
            fill-opacity: 0.1;
            stroke-dasharray: 5, 5;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <button class="toggle-btn" id="toggle-btn">
            <i class="fas fa-chevron-left" id="toggle-icon"></i>
        </button>
        <div class="sidebar-header">
            <h2>Карта партнеров</h2>
            <p>Нажимайте на компании, чтобы включить или выключить их отображение</p>
            
            <div class="total-stats" id="total-companies">Всего компаний: ...</div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Поиск по названию, улице или метро...">
            </div>

            <div class="controls">
                <button class="btn-control" id="select-all">Выбрать все</button>
                <button class="btn-control" id="deselect-all">Снять все</button>
                <button class="btn-control btn-reset-filter" id="reset-filter">Сбросить</button>
            </div>
        </div>
        <div class="company-list" id="company-list">
            <!-- Сюда будут добавляться компании -->
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script>
        console.log("1. Скрипт стартовал");

        const map = L.map('map', { zoomControl: false }).setView([55.751244, 37.618423], 10);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-btn');
        const toggleIcon = document.getElementById('toggle-icon');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('hidden');
            if (sidebar.classList.contains('hidden')) {
                toggleIcon.classList.remove('fa-chevron-left');
                toggleIcon.classList.add('fa-chevron-right');
            } else {
                toggleIcon.classList.remove('fa-chevron-right');
                toggleIcon.classList.add('fa-chevron-left');
            }
            setTimeout(() => map.invalidateSize(), 300);
        });

        let allMarkers = {};
        let companyVisibility = {};
        let companyDisplayNames = {};
        let fitnessClubs = [];
        let radiusCircle = null;
        const COLOR_PARTNER = '#333333';

        fetch('spirit.csv')
            .then(response => response.text())
            .then(csvText => {
                Papa.parse(csvText, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const companiesMap = new Map();

                        results.data.forEach(row => {
                            let company = (row[0] && String(row[0]).trim()) ? String(row[0]).trim() : 'Без названия';
                            
                            const lettersOnly = company.match(/[a-zA-Zа-яА-Я]/g) || [];
                            if (company.length < 2 || lettersOnly.length < 2) return;

                            const companyKey = company.toLowerCase();
                            const officeName = (row[1] && String(row[1]).trim()) ? String(row[1]).trim() : 'Офис';
                            const address = (row[2] && String(row[2]).trim()) ? String(row[2]).trim() : '';
                            const lat = parseFloat(row[3]);
                            const lng = parseFloat(row[4]);
                            const color = (row[5] && String(row[5]).trim()) ? String(row[5]).trim() : COLOR_PARTNER;

                            if (isNaN(lat) || isNaN(lng) || (lat === 0 && lng === 0)) return;

                            if (!companyDisplayNames[companyKey]) {
                                companyDisplayNames[companyKey] = company;
                            }

                            if (!companiesMap.has(companyKey)) {
                                companiesMap.set(companyKey, 0);
                                allMarkers[companyKey] = [];
                                companyVisibility[companyKey] = true;
                            }
                            companiesMap.set(companyKey, companiesMap.get(companyKey) + 1);

                            const customIcon = L.divIcon({
                                className: 'marker-custom',
                                html: `<div style="background-color: ${color}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.5);"></div>`,
                                iconSize: [18, 18],
                                iconAnchor: [9, 9]
                            });

                            const marker = L.marker([lat, lng], { icon: customIcon })
                                .bindPopup(`<b>${companyDisplayNames[companyKey]}</b><br>${officeName}<br><small>${address}</small>`);

                            marker.companyKey = companyKey;
                            marker.officeName = officeName;
                            marker.latLng = L.latLng(lat, lng);

                            if (companyVisibility[companyKey]) {
                                marker.addTo(map);
                            }
                            allMarkers[companyKey].push(marker);

                            if (companyKey === 'spirit.fitness') {
                                fitnessClubs.push({
                                    name: officeName,
                                    latLng: marker.latLng,
                                    marker: marker
                                });
                            }
                        });

                        document.getElementById('total-companies').textContent = `Всего компаний: ${companiesMap.size}`;

                        const sortedKeys = Array.from(companiesMap.keys()).sort((a, b) => {
                            const nameA = companyDisplayNames[a];
                            const nameB = companyDisplayNames[b];
                            const aIsSpirit = nameA.toLowerCase().includes('spirit');
                            const bIsSpirit = nameB.toLowerCase().includes('spirit');
                            if (aIsSpirit && !bIsSpirit) return -1;
                            if (!aIsSpirit && bIsSpirit) return 1;
                            return nameA.localeCompare(nameB);
                        });

                        const companyListDiv = document.getElementById('company-list');

                        sortedKeys.forEach(companyKey => {
                            const count = companiesMap.get(companyKey);
                            const displayName = companyDisplayNames[companyKey];
                            
                            const item = document.createElement('div');
                            item.className = 'company-item active';
                            item.dataset.company = companyKey;

                            item.innerHTML = `
                                <div class="company-info">
                                    <span class="company-name">${displayName}</span>
                                    <span class="company-count">${count}</span>
                                </div>
                                <button class="delete-btn" title="Удалить с карты"><i class="fas fa-trash"></i></button>
                            `;

                            if (companyKey === 'spirit.fitness') {
                                item.style.cursor = 'pointer';
                                item.addEventListener('click', (e) => {
                                    if (e.target.closest('.delete-btn')) return;
                                    
                                    let subContainer = document.getElementById('fitness-sub-list');
                                    if (subContainer) {
                                        subContainer.remove();
                                        return;
                                    }

                                    subContainer = document.createElement('div');
                                    subContainer.id = 'fitness-sub-list';
                                    subContainer.style.background = '#fff';
                                    
                                    fitnessClubs.sort((a, b) => a.name.localeCompare(b.name));

                                    fitnessClubs.forEach(club => {
                                        const subItem = document.createElement('div');
                                        subItem.className = 'company-item fitness-subitem';
                                        subItem.innerHTML = `<span class="company-name">${club.name}</span>`;
                                        
                                        subItem.addEventListener('click', (ev) => {
                                            ev.stopPropagation();
                                            
                                            document.querySelectorAll('.fitness-subitem').forEach(el => el.classList.remove('active'));
                                            subItem.classList.add('active');

                                            if (radiusCircle) {
                                                map.removeLayer(radiusCircle);
                                            }

                                            radiusCircle = L.circle(club.latLng, {
                                                radius: 2000,
                                                className: 'radius-circle'
                                            }).addTo(map);

                                            map.setView(club.latLng, 13);

                                            Object.keys(allMarkers).forEach(key => {
                                                allMarkers[key].forEach(m => {
                                                    if (m.latLng.distanceTo(club.latLng) <= 2000) {
                                                        m.addTo(map);
                                                    } else {
                                                        map.removeLayer(m);
                                                    }
                                                });
                                            });
                                            
                                            club.marker.openPopup();
                                        });
                                        
                                        subContainer.appendChild(subItem);
                                    });

                                    item.parentNode.insertBefore(subContainer, item.nextSibling);
                                });
                            } else {
                                item.addEventListener('click', (e) => {
                                    if (e.target.closest('.delete-btn')) return;
                                    const isCurrentlyVisible = companyVisibility[companyKey];
                                    companyVisibility[companyKey] = !isCurrentlyVisible;

                                    if (radiusCircle) {
                                        map.removeLayer(radiusCircle);
                                        radiusCircle = null;
                                        document.querySelectorAll('.fitness-subitem').forEach(el => el.classList.remove('active'));
                                        Object.keys(allMarkers).forEach(key => {
                                            allMarkers[key].forEach(m => m.addTo(map));
                                        });
                                    }

                                    if (companyVisibility[companyKey]) {
                                        item.classList.add('active');
                                        allMarkers[companyKey].forEach(m => m.addTo(map));
                                    } else {
                                        item.classList.remove('active');
                                        allMarkers[companyKey].forEach(m => map.removeLayer(m));
                                    }
                                });
                            }

                            const deleteBtn = item.querySelector('.delete-btn');
                            deleteBtn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                allMarkers[companyKey].forEach(m => map.removeLayer(m));
                                item.remove();
                                
                                const newTotal = parseInt(document.getElementById('total-companies').textContent.replace(/\D/g,'')) - 1;
                                document.getElementById('total-companies').textContent = `Всего компаний: ${newTotal}`;
                            });

                            companyListDiv.appendChild(item);
                        });

                        // --- ЛОГИКА ПОИСКА ---
                        document.getElementById('search-input').addEventListener('input', function(e) {
                            const query = e.target.value.toLowerCase().trim();
                            
                            if (!query) {
                                // Если поиск пуст, показываем все компании
                                Object.keys(allMarkers).forEach(key => {
                                    allMarkers[key].forEach(m => m.addTo(map));
                                });
                                map.setView([55.751244, 37.618423], 10);
                                return;
                            }

                            let foundMarkers = [];
                            
                            Object.keys(allMarkers).forEach(key => {
                                allMarkers[key].forEach(marker => {
                                    const companyName = companyDisplayNames[marker.companyKey].toLowerCase();
                                    const officeName = marker.officeName.toLowerCase();
                                    const popupContent = marker.getPopup().getContent().toLowerCase();
                                    
                                    if (companyName.includes(query) || officeName.includes(query) || popupContent.includes(query)) {
                                        marker.addTo(map);
                                        foundMarkers.push(marker);
                                    } else {
                                        map.removeLayer(marker);
                                    }
                                });
                            });

                            if (foundMarkers.length > 0) {
                                const group = L.featureGroup(foundMarkers);
                                map.fitBounds(group.getBounds().pad(0.1));
                            }
                        });

                        // --- КНОПКА "СБРОСИТЬ" ---
                        document.getElementById('reset-filter').addEventListener('click', () => {
                            // Очищаем поиск
                            document.getElementById('search-input').value = '';
                            
                            // Убираем круг радиуса
                            if (radiusCircle) {
                                map.removeLayer(radiusCircle);
                                radiusCircle = null;
                            }
                            document.querySelectorAll('.fitness-subitem').forEach(el => el.classList.remove('active'));

                            // Возвращаем все маркеры на карту
                            Object.keys(allMarkers).forEach(key => {
                                companyVisibility[key] = true;
                                allMarkers[key].forEach(m => m.addTo(map));
                            });

                            // Сбрасываем зум
                            map.setView([55.751244, 37.618423], 10);
                        });

                        // Кнопка "Выбрать все"
                        document.getElementById('select-all').addEventListener('click', () => {
                            document.getElementById('reset-filter').click();
                        });

                        // Кнопка "Снять все"
                        document.getElementById('deselect-all').addEventListener('click', () => {
                            document.getElementById('reset-filter').click();
                            // После сброса скрываем все маркеры
                            Object.keys(allMarkers).forEach(key => {
                                companyVisibility[key] = false;
                                const item = document.querySelector(`.company-item[data-company="${key}"]`);
                                if (item) item.classList.remove('active');
                                allMarkers[key].forEach(m => map.removeLayer(m));
                            });
                        });

                    }
                });
            })
            .catch(error => console.error('Ошибка загрузки CSV:', error));
    </script>
</body>
</html>
