<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта партнеров</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; left: 320px; right: 0; }
        #sidebar {
            position: absolute; top: 0; bottom: 0; left: 0; width: 320px;
            background: #f8f9fa; border-right: 1px solid #ddd; padding: 15px;
            overflow-y: auto; box-sizing: border-box; z-index: 1000;
        }
        h2 { margin-top: 0; font-size: 18px; color: #333; }
        .subtitle { font-size: 13px; color: #666; margin-bottom: 10px; }
        .total-count { font-weight: bold; color: #e67e22; margin-bottom: 10px; }
        .buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .buttons button {
            flex: 1; padding: 8px; border: 1px solid #ccc; background: #fff;
            border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .buttons button:hover { background: #eee; }
        .company-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid #eee; cursor: pointer;
        }
        .company-item:hover { background: #f0f0f0; }
        .company-item input[type="checkbox"] { margin-right: 10px; }
        .company-name { flex: 1; font-size: 14px; color: #333; }
        .company-count {
            background: #eee; color: #666; padding: 2px 8px;
            border-radius: 12px; font-size: 12px;
        }
        .leaflet-popup-content { font-size: 14px; }
        .leaflet-popup-content b { color: #333; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Карта партнеров</h2>
    <div class="subtitle">Нажимайте на компании, чтобы включить или выключить их отображение</div>
    <div class="total-count" id="total-count">Всего компаний: 0</div>
    <div class="buttons">
        <button onclick="selectAll(true)">Выбрать все</button>
        <button onclick="selectAll(false)">Снять все</button>
    </div>
    <div id="company-list"></div>
</div>

<div id="map"></div>

<script>
    // Инициализация карты
    var map = L.map('map').setView([55.7558, 37.6173], 10); // Центр на Москву

    // Слой карты (ИСПРАВЛЕНО: защищенный протокол https и новый сервер)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var markersLayer = L.layerGroup().addTo(map);
    var allData = [];
    var companyMarkers = {};
    var colorPalette = ['#FF5733', '#33FF57', '#3357FF', '#F333FF', '#FF33A8', '#33FFF0', '#FFC300', '#FF3333', '#8E44AD', '#2980B9'];
    var colorIndex = 0;

    // Загрузка CSV
    Papa.parse('spirit.csv', {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            allData = results.data;
            renderList();
            renderMarkers();
        },
        error: function(err) {
            alert('Ошибка загрузки файла spirit.csv. Убедитесь, что он лежит рядом с index.html.');
            console.error(err);
        }
    });

    function renderList() {
        var listContainer = document.getElementById('company-list');
        listContainer.innerHTML = '';
        
        var companies = {};
        allData.forEach(function(row) {
            var name = row['Компания'] || row['Company'] || row['Название'];
            if (name) {
                companies[name] = (companies[name] || 0) + 1;
            }
        });

        var total = 0;
        Object.keys(companies).sort().forEach(function(name) {
            total += companies[name];
            var div = document.createElement('div');
            div.className = 'company-item';
            div.innerHTML = `
                <input type="checkbox" id="chk_${name}" checked onchange="toggleCompany('${name}')">
                <span class="company-name">${name}</span>
                <span class="company-count">${companies[name]}</span>
            `;
            listContainer.appendChild(div);
        });
        
        document.getElementById('total-count').innerText = 'Всего компаний: ' + total;
    }

    function renderMarkers() {
        markersLayer.clearLayers();
        companyMarkers = {};
        
        var companyColors = {};
        allData.forEach(function(row) {
            var name = row['Компания'] || row['Company'] || row['Название'];
            if (!name) return;
            
            if (!companyColors[name]) {
                companyColors[name] = colorPalette[colorIndex % colorPalette.length];
                colorIndex++;
            }

            var lat = parseFloat(row['Широта'] || row['Latitude'] || row['Lat']);
            var lng = parseFloat(row['Долгота'] || row['Longitude'] || row['Lng']);
            
            if (isNaN(lat) || isNaN(lng)) return;

            var marker = L.circleMarker([lat, lng], {
                radius: 6,
                fillColor: companyColors[name],
                color: "#fff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9
            });

            var popupContent = `<b>${name}</b><br>`;
            if (row['Адрес']) popupContent += `Адрес: ${row['Адрес']}<br>`;
            if (row['Сайт']) popupContent += `Сайт: <a href="${row['Сайт']}" target="_blank">${row['Сайт']}</a><br>`;
            
            marker.bindPopup(popupContent);
            
            if (!companyMarkers[name]) companyMarkers[name] = [];
            companyMarkers[name].push(marker);
            
            marker.addTo(markersLayer);
        });
    }

    function toggleCompany(name) {
        var chk = document.getElementById('chk_' + name);
        if (!companyMarkers[name]) return;
        
        companyMarkers[name].forEach(function(marker) {
            if (chk.checked) {
                marker.addTo(markersLayer);
            } else {
                markersLayer.removeLayer(marker);
            }
        });
    }

    function selectAll(checked) {
        var checkboxes = document.querySelectorAll('#company-list input[type="checkbox"]');
        checkboxes.forEach(function(chk) {
            chk.checked = checked;
            var name = chk.id.replace('chk_', '');
            toggleCompany(name);
        });
    }
</script>

</body>
</html>
